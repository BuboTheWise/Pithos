00000,5.919384;" /></g><text x="2142.5" y="97.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:14px"><tspan x="2142.5" dy="0">Each unit keeps its own AC inlet, bottom-panel pull fan and intake windows.</tspan><tspan x="2142.5" dy="15">Single unit numbers apply per unit. The default cluster adds only a short Cat6.</tspan><tspan x="2142.5" dy="15">LAN is each board&#39;s Wi-Fi 7 adapter. Never run cluster traffic over Wi-Fi.</tspan><tspan x="2142.5" dy="15">USB 5GbE adapters are an optional upgrade if 1G prefill is a problem.</tspan></text></g><g class="dWEucGE= hot"><g class="shape" ><rect x="963" y="46" width="422" height="98" stroke="#d1242f" fill="#fee2e2" style="stroke-width:2;" /></g><text x="1174" y="84.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="1174" dy="0">vented panel UP</tspan><tspan x="1174" dy="17.666667">fan + hood + windows</tspan><tspan x="1174" dy="17.666667">100 mm or more clear around the hood outlets</tspan></text></g><g class="dWEuaW8= ok"><g class="shape" ><rect x="963" y="152" width="422" height="66" stroke="#1a7f37" fill="#dcfce7" style="stroke-width:2;" /></g><text x="1174" y="190.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">I/O end 80 mm clear: LAN jack used as the 1G interlink</text></g><g class="dWEuYWM= warn"><g class="shape" ><rect x="1393" y="46" width="419" height="66" stroke="#e07b00" fill="#fff7ed" style="stroke-width:2;" /></g><text x="1602.5" y="84.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">PSU end 95 mm clear; fused C14 inlet on the side wall</text></g><g class="dWEuYmQ= gray"><g class="shape" ><rect x="1393" y="120" width="419" height="98" stroke="#6b7280" fill="#f3f4f6" style="stroke-width:2;" /></g><text x="1602.5" y="158.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="1602.5" dy="0">BC-250</tspan><tspan x="1602.5" d