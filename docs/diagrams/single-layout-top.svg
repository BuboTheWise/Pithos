<text x="56" y="461" font-size="12">1 nyacom case, UNMODIFIED (175 x 125 x 339 mm), its shared face pressed flat against the INSIDE of the</text>
<text x="56" y="477" font-size="12">vented panel on thin 3 mm bumper pads (NOT a seal). NO internal shunt, hood or collar. Grey brackets on</text>
<text x="56" y="493" font-size="12">the long sides are the hold-downs (never at the I/O or PSU end); brown dimensions are the cable</text>
<text x="56" y="509" font-size="12">clearances.</text>
<text x="56" y="525" font-size="12">2 Pull fan NF-A14x25 G2 PWM (140 mm), bolted to the OUTER face of the panel (frame dashed) over a round</text>
<text x="56" y="541" font-size="12">130 mm hole (red circle). Eight 76 x 6 mm slanted slots: red = open through the hole, grey = blocked by</text>
<text x="56" y="557" font-size="12">the panel. Red arrows = outlets of the external deflector hood (toward the I/O end and the near wall),</text>
<text x="56" y="573" font-size="12">away from the intake windows.</text>
<text x="56" y="589" font-size="12">3 nyacom 118 mm case-fan opening (blue circle), under intake window A.   4 Intake windows: A 105 x 105</text>
<text x="56" y="605" font-size="12">mm; B (cabin make-up) 80 x 80 mm; both behind 120 mm washable filters (blue dashed).</text>
<text x="56" y="621" font-size="12">5 ONE fused C14 AC inlet on the long side wall at the PSU end (keeps the PSU-end gap free for the C13</text>
<text x="56" y="637" font-size="12">plug); orange dashed = mains to the PSU. Grey dashed = 1 GbE to the LAN jack.</text>
<text x="56" y="653" font-size="12">Slot field, case-fan opening and envelope are measured from nyacom's STL files</text>
<text x="56" y="669" font-size="12">(tools/nyacom_measure.py); board, PSU and printed parts are schematic. Seen from the lid side through</text>
<text x="56" y="685" font-size="12">the case, so the slot lean may be a mirror image of the real cover.</text>
<text x="391" y="38" text-anchor="middle" font-size="13" font-weight="bold">Single unit: Apache 5800 (HF 64819): floor plan from the lid side, looking at the panel inside (to scale)</text>
</svg>
