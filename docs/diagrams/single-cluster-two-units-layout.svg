<text x="512" y="24" text-anchor="middle" font-size="14" font-weight="bold">Two single units clustered (default 1G direct), floor plans to scale, I/O ends facing each other</text>
<line x1="428.9" y1="124.3" x2="567.9" y2="124.3" stroke="#1a7f37" stroke-width="4"/>
<text x="512" y="146.3" text-anchor="middle" font-size="11" fill="#1a7f37" font-weight="bold">one Cat6 between the onboard 1G ports (via the LAN jacks)</text>
<text x="512" y="160.3" text-anchor="middle" font-size="11" fill="#1a7f37">1G direct link, RPC :50052; LAN via each board's Wi-Fi 7 adapter</text>
<text x="56" y="302" font-size="12">Each unit keeps its own AC inlet, bottom-panel pull fan and intake windows (the single-unit numbers apply per unit). The default cluster uses the</text>
<text x="56" y="318" font-size="12">onboard 1G ports; LAN is each board's Wi-Fi 7 adapter. Never run cluster traffic over Wi-Fi. USB 5GbE adapters are an optional upgrade. Keep 150 mm or</text>
<text x="56" y="334" font-size="12">more between units and 100 mm or more in front of each vented panel. Never stack one on the other.</text>
</svg>
