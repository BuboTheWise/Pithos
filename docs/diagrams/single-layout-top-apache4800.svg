<text x="56" y="508" font-size="12">1 nyacom case, UNMODIFIED (175 x 125 x 339 mm), its shared face pressed flat against the</text>
<text x="56" y="524" font-size="12">INSIDE of the vented panel on thin 3 mm bumper pads (NOT a seal). NO internal shunt, hood or</text>
<text x="56" y="540" font-size="12">collar. Grey brackets on the long sides are the hold-downs (never at the I/O or PSU end);</text>
<text x="56" y="556" font-size="12">brown dimensions are the cable clearances.</text>
<text x="56" y="572" font-size="12">2 Pull fan NF-A14x25 G2 PWM (140 mm), bolted to the OUTER face of the panel (frame dashed)</text>
<text x="56" y="588" font-size="12">over a round 130 mm hole (red circle). Eight 76 x 6 mm slanted slots: red = open through the</text>
<text x="56" y="604" font-size="12">hole, grey = blocked by the panel. Red arrows = outlets of the external deflector hood</text>
<text x="56" y="620" font-size="12">(toward the I/O end and the near wall), away from the intake windows.</text>
<text x="56" y="636" font-size="12">3 nyacom 118 mm case-fan opening (blue circle), under intake window A.   4 Intake windows: A</text>
<text x="56" y="652" font-size="12">105 x 105 mm; B (cabin make-up) 80 x 80 mm; both behind 120 mm washable filters (blue</text>
<text x="56" y="668" font-size="12">dashed).</text>
<text x="56" y="684" font-size="12">5 ONE fused C14 AC inlet on the long side wall at the PSU end (keeps the PSU-end gap free</text>
<text x="56" y="700" font-size="12">for the C13 plug); orange dashed = mains to the PSU. Grey dashed = 1 GbE to the LAN jack.</text>
<text x="56" y="716" font-size="12">Slot field, case-fan opening and envelope are measured from nyacom's STL files</text>
<text x="56" y="732" font-size="12">(tools/nyacom_measure.py); board, PSU and printed parts are schematic. Seen from the lid</text>
<text x="56" y="748" font-size="12">side through the case, so the slot lean may be a mirror image of the real cover.</text>
<text x="354" y="38" text-anchor="middle" font-size="13" font-weight="bold">Single unit, tight alternative: Apache 4800 (HF 64250): floor plan from the lid side, looking at the panel inside (to scale)</text>
</svg>
